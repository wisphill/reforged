name: Reforged
options:
  bundleIdPrefix: com.yuu
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Reforged:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuu.reforged
        PRODUCT_NAME: Reforged
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_CFBundleDisplayName: Reforged
        ENABLE_HARDENED_RUNTIME: YES
        # Sandbox is off for now; when Obsidian vault access is added,
        # either enable it with user-selected-file entitlements or keep it off.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
